[project]
name = "api-test-orchestrator"
version = "1.0.0"
description = "Declarative API QA suites with assertions, extraction, retries, parallel execution and JUnit reporting"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
